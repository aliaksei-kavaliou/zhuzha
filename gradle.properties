org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# Onyx pen SDK still references the legacy android.support.* packages; Jetifier
# rewrites them to their androidx equivalents at build time so we don't get
# "Duplicate class android.support.v4..." from the SDK vs androidx.core.
android.enableJetifier=true

kotlin.code.style=official
