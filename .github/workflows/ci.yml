name: CI

# A pull request is the only route a contributor has into main (CONTRIBUTING.md),
# so that is where the tests have to run. Pushes to main are covered too, because
# the owner can bypass the PR rule and should still hear about a break.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # A newer push to the same ref cancels the older run; the stale answer is never
  # the one anyone wants, and this is a free tier.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      # :core is pure Kotlin/JVM and needs none of this, but `test` builds both
      # modules and :app is Android. The action accepts the SDK licences, which
      # is what lets AGP fetch compileSdk 36 by itself.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # :core:test, :app:testDebugUnitTest and :app:testReleaseUnitTest.
      # No keystore is present and none is needed: app/build.gradle.kts reads the
      # signing properties with orNull and leaves release unsigned when they are
      # absent, which is exactly this machine.
      - name: Test
        run: ./gradlew test --console=plain

      # Only on failure: the reports are the first thing anyone wants and the
      # console output alone does not say which assertion went.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          retention-days: 7
